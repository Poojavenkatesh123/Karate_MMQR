name: Karate API Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # 👈 optional manual trigger

jobs:
  karate-test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://mpay-uat.okdollar.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Project Structure (IMPORTANT 🔥)
        run: |
          echo "Listing project files..."
          ls -R
          echo "Checking karate-config.js..."
          ls src/test/java || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project (skip tests)
        run: mvn clean install -DskipTests

      - name: Run Karate Tests
        run: mvn test

      - name: Debug Reports Folder
        if: always()
        run: |
          echo "Listing reports..."
          ls -R target || true

      - name: Upload Karate HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-html-report
          path: target/karate-reports/